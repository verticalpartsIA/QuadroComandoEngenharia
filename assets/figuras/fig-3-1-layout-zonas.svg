<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="Poppins, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="t31 d31">
  <title id="t31">Figura 3.1 Layout do quadro de comando em zonas</title>
  <desc id="d31">Seis zonas, de cima para baixo, com os componentes confirmados nas fotos e os não confirmados em tracejado.</desc>
  <style>
    .z{fill:#fafafa;stroke:#111;stroke-width:2}
    .c{fill:#fff;stroke:#1F5FA8;stroke-width:2}
    .p{fill:#fff;stroke:#C0392B;stroke-width:2}
    .u{fill:#fff;stroke:#777;stroke-width:2;stroke-dasharray:6 4}
    .t{font-size:13px;fill:#111}
    .s{font-size:11px;fill:#555}
    .h{font-size:14px;font-weight:700;fill:#111}
  </style>
  <rect width="960" height="700" fill="#fff"/>
  <rect x="20" y="20" width="700" height="650" rx="8" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="370" y="12" text-anchor="middle" class="s">Gabinete 1350 x 350 x 240 mm, porta aberta, vista frontal (sem escala)</text>
  <!-- Z1 -->
  <rect x="35" y="35" width="670" height="95" class="z"/>
  <text x="48" y="56" class="h">Zona 1 · Topo</text>
  <rect x="190" y="45" width="330" height="75" class="p"/>
  <text x="355" y="72" text-anchor="middle" class="t">Inversor NICE3000new com a placa MCB-C3</text>
  <text x="355" y="92" text-anchor="middle" class="s">bornes de potência na base; conectores CN2 e CN3</text>
  <text x="355" y="110" text-anchor="middle" class="s">cabo flat de 40 vias sai pelo lado esquerdo</text>
  <!-- Z2 -->
  <rect x="35" y="140" width="670" height="95" class="z"/>
  <text x="48" y="161" class="h">Zona 2 · Interface</text>
  <rect x="190" y="150" width="330" height="48" class="c"/>
  <text x="355" y="180" text-anchor="middle" class="t">Placa de interface KCB-B4A</text>
  <rect x="190" y="204" width="330" height="26" class="u"/>
  <text x="355" y="222" text-anchor="middle" class="s">conjunto escuro sob a KCB, função não confirmada</text>
  <!-- Z3 -->
  <rect x="35" y="245" width="670" height="105" class="z"/>
  <text x="48" y="266" class="h">Zona 3 · Resgate e botoeira</text>
  <rect x="60" y="275" width="250" height="65" class="c"/>
  <text x="185" y="302" text-anchor="middle" class="t">Resgate elétrico ERB-A1</text>
  <text x="185" y="322" text-anchor="middle" class="s">bateria dentro da caixa</text>
  <rect x="400" y="275" width="285" height="65" class="c"/>
  <text x="542" y="302" text-anchor="middle" class="t">Botoeira de inspeção</text>
  <text x="542" y="322" text-anchor="middle" class="s">CIS, CIU E, CID E e MES</text>
  <!-- Z4 -->
  <rect x="35" y="360" width="670" height="105" class="z"/>
  <text x="48" y="381" class="h">Zona 4 · Proteção e contatores</text>
  <g class="t" text-anchor="middle">
    <rect x="50" y="395" width="70" height="60" class="c"/><text x="85" y="420">QFB1</text>
    <rect x="125" y="395" width="70" height="60" class="c"/><text x="160" y="420">DQFB1</text>
    <rect x="200" y="395" width="70" height="60" class="c"/><text x="235" y="420">QFB2</text>
    <rect x="275" y="395" width="70" height="60" class="c"/><text x="310" y="420">DQFB2</text>
    <rect x="420" y="395" width="85" height="60" class="p"/><text x="462" y="420">BY</text>
    <rect x="515" y="395" width="85" height="60" class="p"/><text x="557" y="420">FX</text>
    <rect x="610" y="395" width="85" height="60" class="p"/><text x="652" y="420">SW</text>
  </g>
  <!-- Z5 -->
  <rect x="35" y="475" width="670" height="95" class="z"/>
  <text x="48" y="496" class="h">Zona 5 · Trafo e linha</text>
  <g class="t" text-anchor="middle">
    <rect x="60" y="505" width="140" height="55" class="c"/><text x="130" y="530">Trafo TRF</text>
    <rect x="330" y="505" width="80" height="55" class="c"/><text x="370" y="530">QFB3</text>
    <rect x="420" y="505" width="80" height="55" class="c"/><text x="460" y="530">DQFB3</text>
    <rect x="510" y="505" width="180" height="55" class="p"/><text x="600" y="530">Disjuntor geral QF</text>
  </g>
  <!-- Z6 -->
  <rect x="35" y="580" width="670" height="80" class="z"/>
  <text x="48" y="601" class="h">Zona 6 · Base</text>
  <g class="t" text-anchor="middle">
    <rect x="60" y="610" width="120" height="40" class="c"/><text x="120" y="635">Barra de terra</text>
    <rect x="195" y="610" width="230" height="40" class="c"/><text x="310" y="635">Bornes grandes (2 x 7)</text>
    <rect x="440" y="610" width="110" height="40" class="c"/><text x="495" y="635">Minibornes</text>
    <rect x="565" y="610" width="125" height="40" class="c"/><text x="627" y="635">Tomada</text>
  </g>
  <!-- Legenda e callouts -->
  <g font-size="13" font-weight="700" fill="#111">
    <circle cx="735" cy="82" r="13" fill="#F5C400" stroke="#111"/><text x="735" y="87" text-anchor="middle">1</text>
    <circle cx="735" cy="187" r="13" fill="#F5C400" stroke="#111"/><text x="735" y="192" text-anchor="middle">2</text>
    <circle cx="735" cy="297" r="13" fill="#F5C400" stroke="#111"/><text x="735" y="302" text-anchor="middle">3</text>
    <circle cx="735" cy="412" r="13" fill="#F5C400" stroke="#111"/><text x="735" y="417" text-anchor="middle">4</text>
    <circle cx="735" cy="522" r="13" fill="#F5C400" stroke="#111"/><text x="735" y="527" text-anchor="middle">5</text>
    <circle cx="735" cy="620" r="13" fill="#F5C400" stroke="#111"/><text x="735" y="625" text-anchor="middle">6</text>
  </g>
  <g font-size="12" fill="#333">
    <rect x="760" y="40" width="190" height="2" fill="#111"/>
    <rect x="762" y="60" width="26" height="14" class="p"/><text x="796" y="72">potência</text>
    <rect x="762" y="86" width="26" height="14" class="c"/><text x="796" y="98">comando e sinais</text>
    <rect x="762" y="112" width="26" height="14" class="u"/><text x="796" y="124">não confirmado</text>
    <text x="760" y="160" font-size="11" fill="#666">Não aparecem nas fotos:</text>
    <text x="760" y="176" font-size="11" fill="#666">PCB-D1, QFB4, XA, TA, XB,</text>
    <text x="760" y="192" font-size="11" fill="#666">SZ, CZ e XPE com etiqueta.</text>
    <text x="760" y="214" font-size="11" fill="#666">Os bornes e a tomada da</text>
    <text x="760" y="230" font-size="11" fill="#666">zona 6 são vistos nas fotos,</text>
    <text x="760" y="246" font-size="11" fill="#666">mas sem nome legível.</text>
  </g>
</svg>
