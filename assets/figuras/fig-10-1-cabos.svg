<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Poppins, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="t101 d101">
  <title id="t101">Figura 10.1 Cabos entre o quadro de comando, a cabina e a caixa de corrida</title>
  <desc id="d101">A KCB-B4A liga a caixa de teto por dois cabos de manobra e a caixa de inspeção do poço e os pavimentos por três cabos de poço.</desc>
  <style>
    .k{fill:#fafafa;stroke:#111;stroke-width:3}
    .c{fill:#fff;stroke:#1F5FA8;stroke-width:2.2}
    .p{fill:#fff;stroke:#C0392B;stroke-width:2.2}
    .u{fill:#fff;stroke:#777;stroke-width:2;stroke-dasharray:6 4}
    .h{font-size:14px;font-weight:700;fill:#111}
    .t{font-size:12.5px;fill:#111}
    .s{font-size:11px;fill:#555}
    .l{stroke:#1F5FA8;stroke-width:3;fill:none}
    .lp{stroke:#C0392B;stroke-width:3;fill:none}
  </style>
  <rect width="960" height="620" fill="#fff"/>
  <!-- Quadro -->
  <rect x="20" y="40" width="270" height="520" rx="8" class="k"/>
  <text x="155" y="68" text-anchor="middle" class="h">Quadro de comando</text>
  <text x="155" y="88" text-anchor="middle" class="s">placa KCB-B4A</text>
  <rect x="45" y="120" width="220" height="60" class="p"/><text x="155" y="146" text-anchor="middle" class="t" font-weight="700">AA (16 vias)</text><text x="155" y="164" text-anchor="middle" class="s">220 V, cadeia, fechaduras</text>
  <rect x="45" y="200" width="220" height="60" class="c"/><text x="155" y="226" text-anchor="middle" class="t" font-weight="700">AB (14 vias)</text><text x="155" y="244" text-anchor="middle" class="s">24 V, CAN, interfone, FL1, FL2</text>
  <rect x="45" y="300" width="220" height="50" class="c"/><text x="155" y="322" text-anchor="middle" class="t" font-weight="700">BA (10 pinos)</text><text x="155" y="340" text-anchor="middle" class="s">cadeia e fechaduras</text>
  <rect x="45" y="365" width="220" height="50" class="c"/><text x="155" y="387" text-anchor="middle" class="t" font-weight="700">BB (4 pinos)</text><text x="155" y="405" text-anchor="middle" class="s">24 V e RS-485</text>
  <rect x="45" y="430" width="220" height="50" class="c"/><text x="155" y="452" text-anchor="middle" class="t" font-weight="700">BC (4 pinos)</text><text x="155" y="470" text-anchor="middle" class="s">interfone</text>
  <rect x="45" y="495" width="220" height="50" class="c"/><text x="155" y="517" text-anchor="middle" class="t" font-weight="700">BD e BE (4 pinos)</text><text x="155" y="535" text-anchor="middle" class="s">chaves de desaceleração</text>
  <!-- Cabina -->
  <rect x="640" y="40" width="300" height="220" rx="8" class="k"/>
  <text x="790" y="68" text-anchor="middle" class="h">Cabina, caixa de teto</text>
  <rect x="660" y="95" width="260" height="50" class="p"/><text x="790" y="117" text-anchor="middle" class="t" font-weight="700">CA (16 vias)</text><text x="790" y="135" text-anchor="middle" class="s">mesmos pinos do AA</text>
  <rect x="660" y="160" width="260" height="50" class="c"/><text x="790" y="182" text-anchor="middle" class="t" font-weight="700">CB (14 vias)</text><text x="790" y="200" text-anchor="middle" class="s">mesmos pinos do AB</text>
  <path class="lp" d="M265 150 H640"/><text x="450" y="142" text-anchor="middle" class="s">cabo de manobra A</text>
  <path class="l" d="M265 230 H600 V185 H640"/><text x="450" y="222" text-anchor="middle" class="s">cabo de manobra B</text>
  <!-- Caixa de corrida -->
  <rect x="640" y="290" width="300" height="270" rx="8" class="k" stroke-dasharray="10 5"/>
  <text x="790" y="316" text-anchor="middle" class="h">Caixa de corrida</text>
  <rect x="660" y="335" width="260" height="50" class="c"/><text x="790" y="357" text-anchor="middle" class="t" font-weight="700">Caixa de inspeção do poço</text><text x="790" y="375" text-anchor="middle" class="s">DA, DB, DC (capítulo 11)</text>
  <rect x="660" y="400" width="260" height="50" class="c"/><text x="790" y="422" text-anchor="middle" class="t" font-weight="700">Portas de pavimento</text><text x="790" y="440" text-anchor="middle" class="s">fechaduras 1DS, 2DS e 3DS</text>
  <rect x="660" y="465" width="260" height="40" class="c"/><text x="790" y="490" text-anchor="middle" class="t" font-weight="700">Placas de chamada (HCB)</text>
  <rect x="660" y="515" width="260" height="35" class="c"/><text x="790" y="538" text-anchor="middle" class="t" font-weight="700">Chaves de posição na guia</text>
  <path class="l" d="M265 325 H460 V360 H660"/><path class="l" d="M265 390 H500 V485 H660"/><path class="l" d="M265 455 H540 V365 H660"/><path class="l" d="M265 520 H560 V532 H660"/>
  <path class="l" d="M460 325 V425 H660" stroke-dasharray="0"/>
  <text x="380" y="318" class="s">BA</text><text x="380" y="383" class="s">BB</text><text x="380" y="448" class="s">BC</text><text x="380" y="513" class="s">BD, BE</text>
  <text x="480" y="596" text-anchor="middle" class="s">Azul: comando e sinais. Vermelho: 220 V. O BA passa pelas portas e pelos fins de curso antes da caixa de inspeção do poço.</text>
</svg>
