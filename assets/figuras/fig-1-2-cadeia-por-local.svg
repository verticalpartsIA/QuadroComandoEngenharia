<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Poppins, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="t12 d12">
  <title id="t12">Figura 1.2 Dispositivos da cadeia de segurança e do circuito de fechaduras, por local</title>
  <desc id="d12">Quatro grupos de dispositivos por local chegam às entradas X25 a X28 da placa MCB-C3. A ordem exata de ligação está na folha 19 do esquema Vitinho.</desc>
  <rect width="960" height="640" fill="#ffffff"/>
  <style>
    .box{fill:#fff;stroke:#1F5FA8;stroke-width:2}
    .opt{fill:#fff;stroke:#777;stroke-width:2;stroke-dasharray:6 4}
    .t{font-size:13px;fill:#111}
    .h{font-size:15px;font-weight:700;fill:#111}
    .s{font-size:11px;fill:#555}
    .t2{font-size:11px;fill:#111}
  </style>
  <!-- Grupo 1 -->
  <rect x="20" y="20" width="215" height="360" rx="8" fill="#fafafa" stroke="#111" stroke-width="2.5"/>
  <text x="127" y="46" text-anchor="middle" class="h">Quadro de comando</text>
  <rect x="35" y="62" width="185" height="42" rx="4" class="box"/><text x="127" y="80" text-anchor="middle" class="t">F3</text><text x="127" y="96" text-anchor="middle" class="s">fusível 250 VAC / 1 A</text>
  <rect x="35" y="116" width="185" height="42" rx="4" class="box"/><text x="127" y="134" text-anchor="middle" class="t">MES</text><text x="127" y="150" text-anchor="middle" class="s">botão de parada</text>
  <rect x="35" y="170" width="185" height="42" rx="4" class="box"/><text x="127" y="188" text-anchor="middle" class="t">CIS</text><text x="127" y="204" text-anchor="middle" class="s">operação elétrica de emergência</text>
  <rect x="35" y="224" width="185" height="50" rx="4" class="opt"/><text x="127" y="244" text-anchor="middle" class="t">MES-1 (parada do motor)</text><text x="127" y="262" text-anchor="middle" class="s">PREENCHER [Q60]</text>
  <!-- Grupo 2 -->
  <rect x="255" y="20" width="215" height="360" rx="8" fill="#fafafa" stroke="#111" stroke-width="2.5"/>
  <text x="362" y="46" text-anchor="middle" class="h">Poço e caixa de corrida</text>
  <rect x="270" y="62" width="185" height="36" rx="4" class="box"/><text x="362" y="85" text-anchor="middle" class="t2">PES1 e PES2 (paradas do poço)</text>
  <rect x="270" y="106" width="185" height="36" rx="4" class="box"/><text x="362" y="129" text-anchor="middle" class="t">GTS (polia tensora)</text>
  <rect x="270" y="150" width="185" height="36" rx="4" class="box"/><text x="362" y="173" text-anchor="middle" class="t2">BFS1 e BFS2 (amortecedores)</text>
  <rect x="270" y="194" width="185" height="36" rx="4" class="box"/><text x="362" y="217" text-anchor="middle" class="t2">FLSD e FLSU (fins de curso)</text>
  <rect x="270" y="238" width="185" height="50" rx="4" class="box"/><text x="362" y="258" text-anchor="middle" class="t">PIT, PITU, PITD, PITB</text><text x="362" y="276" text-anchor="middle" class="s">inspeção do poço (folha /42)</text>
  <!-- Grupo 3 -->
  <rect x="490" y="20" width="215" height="360" rx="8" fill="#fafafa" stroke="#111" stroke-width="2.5"/>
  <text x="597" y="46" text-anchor="middle" class="h">Cabina e caixa de teto</text>
  <rect x="505" y="62" width="185" height="36" rx="4" class="box"/><text x="597" y="85" text-anchor="middle" class="t2">TES (parada da caixa de teto)</text>
  <rect x="505" y="106" width="185" height="50" rx="4" class="box"/><text x="597" y="126" text-anchor="middle" class="t">TCI, TCIU, TCID, TCIB</text><text x="597" y="144" text-anchor="middle" class="s">inspeção da caixa de teto</text>
  <rect x="505" y="164" width="185" height="36" rx="4" class="box"/><text x="597" y="187" text-anchor="middle" class="t2">SOS (cunha de segurança)</text>
  <rect x="505" y="208" width="185" height="50" rx="4" class="opt"/><text x="597" y="228" text-anchor="middle" class="t">MSC, SUP1, SUP2</text><text x="597" y="246" text-anchor="middle" class="s">fora do elevador de referência</text>
  <!-- Grupo 4 -->
  <rect x="725" y="20" width="215" height="200" rx="8" fill="#fafafa" stroke="#111" stroke-width="2.5"/>
  <text x="832" y="46" text-anchor="middle" class="h">Circuito de fechaduras</text>
  <rect x="740" y="62" width="185" height="36" rx="4" class="box"/><text x="832" y="85" text-anchor="middle" class="t2">GS1 (porta de cabina)</text>
  <rect x="740" y="106" width="185" height="50" rx="4" class="box"/><text x="832" y="126" text-anchor="middle" class="t">1DS, 2DS, nDS</text><text x="832" y="144" text-anchor="middle" class="s">portas de pavimento</text>
  <rect x="740" y="164" width="185" height="44" rx="4" class="opt"/><text x="832" y="183" text-anchor="middle" class="t">GS2, 1RDS a nRDS</text><text x="832" y="199" text-anchor="middle" class="s">porta traseira, fora do escopo</text>
  <!-- Opcionais -->
  <rect x="725" y="240" width="215" height="140" rx="8" fill="#fafafa" stroke="#777" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="832" y="264" text-anchor="middle" class="h">Opcionais do esquema</text>
  <text x="832" y="290" text-anchor="middle" class="t">RCS, CWSG e OS-G</text>
  <text x="832" y="312" text-anchor="middle" class="s">"When needed, otherwise short circuit"</text>
  <text x="832" y="338" text-anchor="middle" class="t" font-weight="700">PREENCHER [Q54]</text>
  <text x="832" y="358" text-anchor="middle" class="s">presença no elevador de referência</text>
  <!-- Destino -->
  <rect x="20" y="450" width="920" height="110" rx="8" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="480" y="478" text-anchor="middle" class="h">Placa MCB-C3, conector CN2: X25, X26, X27 e X28</text>
  <text x="480" y="503" text-anchor="middle" class="t">entradas de detecção de 110 VAC (±15%) ou 110 VDC (±20%), função definida em F5-37 a F5-40</text>
  <text x="480" y="530" text-anchor="middle" class="s">Redes que chegam ao CN2 no esquema: 130, 131, 133 e 134. Se qualquer contato da série abrir, o sinal não chega.</text>
  <!-- Setas -->
  <g stroke="#111" stroke-width="2.5" fill="none">
    <path d="M127 380 V450"/><path d="M362 380 V450"/><path d="M597 380 V450"/><path d="M832 380 V450"/>
  </g>
  <g fill="#111"><path d="M121 440 L127 452 L133 440Z"/><path d="M356 440 L362 452 L368 440Z"/><path d="M591 440 L597 452 L603 440Z"/><path d="M826 440 L832 452 L838 440Z"/></g>
  <text x="20" y="595" class="s">Tracejado cinza = dispositivo opcional, fora do escopo ou ainda sem resposta. A ordem exata de ligação em série está na folha /19 do Vitinho.</text>
</svg>
