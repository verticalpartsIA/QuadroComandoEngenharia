<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Poppins, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="t41 d41">
  <title id="t41">Figura 4.1 Ordem de montagem do quadro</title>
  <desc id="d41">Doze etapas em sequência: recebimento, mecânica, componentes, terra, potência, comando, placas e conectores, cabo plano de 40 vias, botoeira, conferência cruzada, verificações sem tensão e energização.</desc>
  <style>
    .c{fill:#fff;stroke:#1F5FA8;stroke-width:2.2}
    .p{fill:#fff;stroke:#C0392B;stroke-width:2.4}
    .g{fill:#fafafa;stroke:#111;stroke-width:2.4}
    .n{font-size:15px;font-weight:700;fill:#1F5FA8}
    .t{font-size:13px;fill:#111}
    .s{font-size:11px;fill:#555}
    .l{stroke:#111;stroke-width:2;fill:none}
  </style>
  <defs><marker id="a41" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#111"/></marker></defs>
  <rect width="960" height="520" fill="#fff"/>
  <!-- linha 1: etapas 1 a 4 -->
  <rect x="30" y="40" width="200" height="80" rx="6" class="c"/><text x="45" y="64" class="n">1</text><text x="65" y="64" class="t" font-weight="700">Recebimento</text><text x="45" y="86" class="s">peças e etiquetas</text>
  <rect x="270" y="40" width="200" height="80" rx="6" class="c"/><text x="285" y="64" class="n">2</text><text x="305" y="64" class="t" font-weight="700">Mecânica</text><text x="285" y="86" class="s">trilho, canaleta, chapas</text>
  <rect x="510" y="40" width="200" height="80" rx="6" class="c"/><text x="525" y="64" class="n">3</text><text x="545" y="64" class="t" font-weight="700">Componentes</text><text x="525" y="86" class="s">QF, QFB, contatores, trafo</text>
  <rect x="750" y="40" width="180" height="80" rx="6" class="p"/><text x="765" y="64" class="n" fill="#C0392B" style="fill:#C0392B">4</text><text x="785" y="64" class="t" font-weight="700">Terra primeiro</text><text x="765" y="86" class="s">todos os PE ao barramento</text>
  <path class="l" d="M230 80 H270" marker-end="url(#a41)"/><path class="l" d="M470 80 H510" marker-end="url(#a41)"/><path class="l" d="M710 80 H750" marker-end="url(#a41)"/>
  <!-- linha 2: 5 a 8 -->
  <rect x="750" y="190" width="180" height="80" rx="6" class="p"/><text x="765" y="214" class="n" style="fill:#C0392B">5</text><text x="785" y="214" class="t" font-weight="700">Potência</text><text x="765" y="236" class="s">rede, QF, inversor, SW</text>
  <rect x="510" y="190" width="200" height="80" rx="6" class="c"/><text x="525" y="214" class="n">6</text><text x="545" y="214" class="t" font-weight="700">Comando</text><text x="525" y="236" class="s">220 V e 110 V</text>
  <rect x="270" y="190" width="200" height="80" rx="6" class="c"/><text x="285" y="214" class="n">7</text><text x="305" y="214" class="t" font-weight="700">Placas e conectores</text><text x="285" y="236" class="s">KCB, PCB-D1, ERB, Mini-Fit</text>
  <rect x="30" y="190" width="200" height="80" rx="6" class="c"/><text x="45" y="214" class="n">8</text><text x="65" y="214" class="t" font-weight="700">Cabo plano</text><text x="45" y="236" class="s">MCB-C3 à KCB, 40 vias</text>
  <path class="l" d="M840 120 V190" marker-end="url(#a41)"/>
  <path class="l" d="M750 230 H710" marker-end="url(#a41)"/><path class="l" d="M510 230 H470" marker-end="url(#a41)"/><path class="l" d="M270 230 H230" marker-end="url(#a41)"/>
  <!-- linha 3: 9 a 12 -->
  <rect x="30" y="340" width="200" height="80" rx="6" class="c"/><text x="45" y="364" class="n">9</text><text x="65" y="364" class="t" font-weight="700">Botoeira</text><text x="45" y="386" class="s">botões e conector KY4</text>
  <rect x="270" y="340" width="200" height="80" rx="6" class="c"/><text x="285" y="364" class="n">10</text><text x="312" y="364" class="t" font-weight="700">Conferência cruzada</text><text x="285" y="386" class="s">segunda pessoa, Apêndice A</text>
  <rect x="510" y="340" width="200" height="80" rx="6" class="g"/><text x="525" y="364" class="n" style="fill:#111">11</text><text x="552" y="364" class="t" font-weight="700">Sem tensão</text><text x="525" y="386" class="s">verificações da seção 4.7</text>
  <rect x="750" y="340" width="180" height="80" rx="6" class="g"/><text x="765" y="364" class="n" style="fill:#111">12</text><text x="792" y="364" class="t" font-weight="700">Energização</text><text x="765" y="386" class="s">capítulo 12</text>
  <path class="l" d="M130 270 V340" marker-end="url(#a41)"/>
  <path class="l" d="M230 380 H270" marker-end="url(#a41)"/><path class="l" d="M470 380 H510" marker-end="url(#a41)"/><path class="l" d="M710 380 H750" marker-end="url(#a41)"/>
  <text x="480" y="470" text-anchor="middle" class="s">Vermelho: etapas com potência ou terra. Cinza: etapas de liberação. A etapa 11 só termina com todos os itens marcados.</text>
  <text x="480" y="492" text-anchor="middle" class="s">Fonte: prática de montagem do Rev. 11 (pág. 12), reescrita a partir do manual do NICE3000new e do esquema.</text>
</svg>
