<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="Poppins, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="t51 d51">
  <title id="t51">Figura 5.1 Caminho do quadro depois da montagem</title>
  <desc id="d51">A montagem passa aos testes da Automação. Se falha, volta à correção. Se passa, vai à inspeção da Qualidade. Se há não conformidade, volta ao tratamento. Se conforme, a Qualidade libera para a expedição.</desc>
  <style>
    .c{fill:#fff;stroke:#1F5FA8;stroke-width:2.2}
    .p{fill:#fff;stroke:#C0392B;stroke-width:2.4}
    .g{fill:#fafafa;stroke:#111;stroke-width:2.4}
    .h{font-size:14px;font-weight:700;fill:#111}
    .t{font-size:12.5px;fill:#111}
    .s{font-size:11px;fill:#555}
    .l{stroke:#111;stroke-width:2;fill:none}
    .lr{stroke:#C0392B;stroke-width:2;fill:none;stroke-dasharray:6 4}
  </style>
  <defs>
    <marker id="a51" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#111"/></marker>
    <marker id="r51" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#C0392B"/></marker>
  </defs>
  <rect width="960" height="460" fill="#fff"/>
  <rect x="20" y="60" width="190" height="90" rx="6" class="c"/><text x="115" y="94" text-anchor="middle" class="h">Montagem</text><text x="115" y="116" text-anchor="middle" class="s">capítulo 4</text><text x="115" y="134" text-anchor="middle" class="s">verificações sem tensão</text>
  <rect x="270" y="60" width="210" height="90" rx="6" class="c"/><text x="375" y="94" text-anchor="middle" class="h">Testes da Automação</text><text x="375" y="116" text-anchor="middle" class="s">E1 a E12 e R1 a R8</text><text x="375" y="134" text-anchor="middle" class="s">registro na Ordem de Produção</text>
  <rect x="540" y="60" width="210" height="90" rx="6" class="p"/><text x="645" y="94" text-anchor="middle" class="h">Inspeção da Qualidade</text><text x="645" y="116" text-anchor="middle" class="s">checklist da Ordem de Produção</text><text x="645" y="134" text-anchor="middle" class="s">resultado registrado</text>
  <rect x="800" y="60" width="140" height="90" rx="6" class="g"/><text x="870" y="94" text-anchor="middle" class="h">Liberação</text><text x="870" y="116" text-anchor="middle" class="s">pela Qualidade,</text><text x="870" y="134" text-anchor="middle" class="s">para a Expedição</text>
  <path class="l" d="M210 105 H270" marker-end="url(#a51)"/><path class="l" d="M480 105 H540" marker-end="url(#a51)"/><path class="l" d="M750 105 H800" marker-end="url(#a51)"/>
  <text x="240" y="96" text-anchor="middle" class="s">pronto</text><text x="510" y="96" text-anchor="middle" class="s">ok</text><text x="775" y="96" text-anchor="middle" class="s">ok</text>
  <!-- retornos -->
  <rect x="270" y="260" width="210" height="80" rx="6" class="c"/><text x="375" y="292" text-anchor="middle" class="h">Corrigir e testar de novo</text><text x="375" y="314" text-anchor="middle" class="s">responsabilidade da Automação</text>
  <rect x="540" y="260" width="210" height="80" rx="6" class="p"/><text x="645" y="292" text-anchor="middle" class="h">Tratar a não conformidade</text><text x="645" y="314" text-anchor="middle" class="s">identificar, registrar, retrabalhar</text>
  <path class="lr" d="M375 150 V260" marker-end="url(#r51)"/><text x="385" y="210" class="s">teste falhou</text>
  <path class="lr" d="M645 150 V260" marker-end="url(#r51)"/><text x="655" y="210" class="s">não conforme</text>
  <path class="lr" d="M270 300 H115 V150" marker-end="url(#r51)"/>
  <path class="lr" d="M540 300 H510 V380 H375 V340" marker-end="url(#r51)"/>
  <text x="480" y="425" text-anchor="middle" class="s">Depois de qualquer correção, refazem-se os testes e a inspeção aplicáveis. Só produto conforme é liberado.</text>
  <text x="480" y="445" text-anchor="middle" class="s">Fonte: POP-ISO-PCP, seções 6.1.12, 6.1.13 e 6.5 (Rev. 00).</text>
</svg>
