<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Poppins, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="t11 d11">
  <title id="t11">Figura 1.1 Diagrama em blocos do elevador sem casa de máquinas</title>
  <desc id="d11">Rede elétrica alimenta o quadro de comando. O quadro liga a máquina de tração e freio, a cabina por cabo de manobra e a caixa de corrida por cabos de poço.</desc>
  <rect width="960" height="560" fill="#ffffff"/>
  <!-- Rede -->
  <rect x="30" y="60" width="150" height="70" rx="6" fill="#fff" stroke="#C0392B" stroke-width="2.5"/>
  <text x="105" y="90" text-anchor="middle" font-size="15" font-weight="600" fill="#111">Rede elétrica</text>
  <text x="105" y="112" text-anchor="middle" font-size="13" fill="#555">R, S, T e N</text>
  <!-- Quadro -->
  <rect x="250" y="30" width="330" height="290" rx="8" fill="#fafafa" stroke="#111" stroke-width="3"/>
  <text x="415" y="58" text-anchor="middle" font-size="16" font-weight="700" fill="#111">Quadro de comando</text>
  <rect x="270" y="75" width="290" height="46" rx="5" fill="#fff" stroke="#C0392B" stroke-width="2"/>
  <text x="415" y="103" text-anchor="middle" font-size="14" fill="#111">Disjuntor geral e proteções</text>
  <rect x="270" y="135" width="290" height="46" rx="5" fill="#fff" stroke="#C0392B" stroke-width="2"/>
  <text x="415" y="163" text-anchor="middle" font-size="14" fill="#111">Inversor NICE3000new (MCB-C3)</text>
  <rect x="270" y="195" width="290" height="46" rx="5" fill="#fff" stroke="#1F5FA8" stroke-width="2"/>
  <text x="415" y="223" text-anchor="middle" font-size="14" fill="#111">Placa de interface KCB-B4A</text>
  <rect x="270" y="255" width="290" height="46" rx="5" fill="#fff" stroke="#1F5FA8" stroke-width="2"/>
  <text x="415" y="283" text-anchor="middle" font-size="14" fill="#111">Resgate elétrico ERB-A1</text>
  <!-- Máquina -->
  <rect x="740" y="60" width="190" height="90" rx="6" fill="#fff" stroke="#C0392B" stroke-width="2.5"/>
  <text x="835" y="95" text-anchor="middle" font-size="15" font-weight="600" fill="#111">Máquina de tração</text>
  <text x="835" y="117" text-anchor="middle" font-size="13" fill="#555">motor, freio e encoder</text>
  <!-- Cabina -->
  <rect x="740" y="200" width="190" height="120" rx="6" fill="#fff" stroke="#1F5FA8" stroke-width="2.5"/>
  <text x="835" y="232" text-anchor="middle" font-size="15" font-weight="600" fill="#111">Cabina</text>
  <text x="835" y="256" text-anchor="middle" font-size="13" fill="#555">caixa de teto CTW-B3</text>
  <text x="835" y="276" text-anchor="middle" font-size="13" fill="#555">operador de porta</text>
  <text x="835" y="296" text-anchor="middle" font-size="13" fill="#555">botoeira de cabina</text>
  <!-- Caixa de corrida -->
  <rect x="250" y="380" width="680" height="150" rx="8" fill="#fafafa" stroke="#111" stroke-width="3" stroke-dasharray="10 5"/>
  <text x="590" y="408" text-anchor="middle" font-size="16" font-weight="700" fill="#111">Caixa de corrida</text>
  <rect x="270" y="425" width="190" height="85" rx="5" fill="#fff" stroke="#1F5FA8" stroke-width="2"/>
  <text x="365" y="455" text-anchor="middle" font-size="14" font-weight="600" fill="#111">Portas de pavimento</text>
  <text x="365" y="478" text-anchor="middle" font-size="13" fill="#555">fechaduras 1DS a nDS</text>
  <rect x="490" y="425" width="210" height="85" rx="5" fill="#fff" stroke="#1F5FA8" stroke-width="2"/>
  <text x="595" y="455" text-anchor="middle" font-size="14" font-weight="600" fill="#111">Poço</text>
  <text x="595" y="478" text-anchor="middle" font-size="13" fill="#555">caixa de inspeção do poço</text>
  <text x="595" y="496" text-anchor="middle" font-size="13" fill="#555">chaves do poço</text>
  <rect x="730" y="425" width="180" height="85" rx="5" fill="#fff" stroke="#1F5FA8" stroke-width="2"/>
  <text x="820" y="455" text-anchor="middle" font-size="14" font-weight="600" fill="#111">Chaves na guia</text>
  <text x="820" y="478" text-anchor="middle" font-size="13" fill="#555">fins de curso</text>
  <text x="820" y="496" text-anchor="middle" font-size="13" fill="#555">desaceleração</text>
  <!-- Ligações -->
  <line x1="180" y1="95" x2="250" y2="95" stroke="#C0392B" stroke-width="3"/>
  <line x1="580" y1="105" x2="740" y2="105" stroke="#C0392B" stroke-width="3"/>
  <line x1="580" y1="255" x2="740" y2="255" stroke="#1F5FA8" stroke-width="3"/>
  <line x1="415" y1="320" x2="415" y2="380" stroke="#1F5FA8" stroke-width="3"/>
  <!-- Callouts -->
  <g font-size="13" font-weight="700" fill="#111">
    <circle cx="215" cy="80" r="13" fill="#F5C400" stroke="#111"/><text x="215" y="85" text-anchor="middle">1</text>
    <circle cx="660" cy="90" r="13" fill="#F5C400" stroke="#111"/><text x="660" y="95" text-anchor="middle">2</text>
    <circle cx="660" cy="240" r="13" fill="#F5C400" stroke="#111"/><text x="660" y="245" text-anchor="middle">3</text>
    <circle cx="445" cy="350" r="13" fill="#F5C400" stroke="#111"/><text x="445" y="355" text-anchor="middle">4</text>
  </g>
  <!-- Legenda de cores -->
  <g font-size="12" fill="#333">
    <line x1="30" y1="400" x2="70" y2="400" stroke="#C0392B" stroke-width="3"/><text x="78" y="404">Potência</text>
    <line x1="30" y1="425" x2="70" y2="425" stroke="#1F5FA8" stroke-width="3"/><text x="78" y="429">Comando e sinais</text>
    <text x="30" y="458" font-size="11" fill="#666">Cores só neste diagrama:</text>
    <text x="30" y="474" font-size="11" fill="#666">os fios reais do quadro</text>
    <text x="30" y="490" font-size="11" fill="#666">são pretos e se identificam</text>
    <text x="30" y="506" font-size="11" fill="#666">pela anilha.</text>
  </g>
</svg>
