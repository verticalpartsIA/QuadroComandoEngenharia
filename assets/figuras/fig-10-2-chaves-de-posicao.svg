<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Poppins, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="t102 d102">
  <title id="t102">Figura 10.2 Arranjo das chaves de posição na caixa de corrida</title>
  <desc id="d102">No extremo superior da caixa de corrida, da placa de nivelamento para cima: chave de limite a 30 a 50 mm, chave de fim de curso a 150 mm e a chave de desaceleração a uma distância L. No extremo inferior, o arranjo é simétrico.</desc>
  <style>
    .t{font-size:13px;fill:#111}
    .s{font-size:11.5px;fill:#555}
    .h{font-size:14px;font-weight:700;fill:#111}
    .g{stroke:#111;stroke-width:3;fill:none}
    .m{stroke:#1F5FA8;stroke-width:2;fill:none}
    .d{stroke:#C0392B;stroke-width:2;fill:none}
  </style>
  <rect width="960" height="640" fill="#fff"/>
  <!-- guia -->
  <line x1="480" y1="30" x2="480" y2="610" class="g"/>
  <text x="494" y="46" class="s">guia</text>
  <!-- níveis (do topo para baixo) -->
  <g>
    <!-- fim de curso superior -->
    <rect x="465" y="70" width="30" height="14" fill="#C0392B"/>
    <text x="520" y="82" class="h">Chave de fim de curso superior</text>
    <text x="520" y="100" class="s">em geral a 150 mm da posição de nivelamento do último pavimento</text>
    <!-- limite superior -->
    <rect x="465" y="150" width="30" height="14" fill="#ea580c"/>
    <text x="520" y="162" class="h">Chave de limite superior</text>
    <text x="520" y="180" class="s">de 30 a 50 mm acima da posição de nivelamento</text>
    <!-- nivelamento do último pavimento -->
    <rect x="450" y="228" width="60" height="10" fill="#1F5FA8"/>
    <text x="520" y="236" class="h">Placa de nivelamento do último pavimento</text>
    <text x="520" y="254" class="s">posição de nivelamento do topo</text>
    <!-- desaceleração 1 -->
    <rect x="465" y="330" width="30" height="14" fill="#111"/>
    <text x="520" y="342" class="h">Chave de desaceleração de subida 1</text>
    <text x="520" y="360" class="s">a uma distância L do nivelamento do topo,</text><text x="520" y="376" class="s">com L maior que V² / (2 x F3-08)</text>
    <!-- placa pavimento intermediário -->
    <rect x="450" y="450" width="60" height="10" fill="#1F5FA8"/>
    <text x="520" y="458" class="h">Placa de nivelamento de um pavimento intermediário</text>
    <text x="520" y="476" class="s">uma por pavimento, com a mesma profundidade e verticalidade;</text><text x="520" y="492" class="s">D (borda do sensor à borda da placa) entre 80 e 200 mm</text>
    <!-- inferior: simétrico -->
    <rect x="450" y="560" width="60" height="10" fill="#1F5FA8"/>
    <text x="520" y="568" class="h">Primeiro pavimento</text>
    <text x="520" y="586" class="s">abaixo dele o arranjo é simétrico: limite, fim de curso</text><text x="520" y="602" class="s">e desaceleração de descida</text>
  </g>
  <!-- cotas -->
  <path class="d" d="M370 84 V228"/><path class="d" d="M370 84 l-5 8 M370 84 l5 8 M370 228 l-5 -8 M370 228 l5 -8"/>
  <path class="m" d="M420 164 V228"/><path class="m" d="M420 164 l-5 8 M420 164 l5 8 M420 228 l-5 -8 M420 228 l5 -8"/>
  <text x="360" y="160" text-anchor="end" class="s">cerca de 150 mm</text>
  <text x="410" y="200" text-anchor="end" class="s">30 a 50 mm</text>
  <path class="d" d="M420 238 V330"/><path class="d" d="M420 238 l-5 8 M420 238 l5 8 M420 330 l-5 -8 M420 330 l5 -8"/>
  <text x="410" y="290" text-anchor="end" class="h">L</text>
  <text x="40" y="630" class="s">Esquema fora de escala. Fonte: manual NICE3000new, seção 2.4, Figura 2-37.</text>
</svg>
