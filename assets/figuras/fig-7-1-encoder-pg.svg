<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Poppins, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="t71 d71">
  <title id="t71">Figura 7.1 Ligação da placa PG-E ao encoder SIN/COS</title>
  <desc id="d71">Doze sinais ligam o conector CN1 da placa MCTC-PG-E ao encoder, em pares trançados e com cabo blindado.</desc>
  <style>
    .b{fill:#fff;stroke:#111;stroke-width:2.5}
    .c{fill:#fff;stroke:#1F5FA8;stroke-width:2}
    .t{font-size:12.5px;fill:#111}
    .s{font-size:11px;fill:#555}
    .h{font-size:14px;font-weight:700;fill:#111}
    .l{stroke:#1F5FA8;stroke-width:2.2;fill:none}
    .sh{stroke:#444;stroke-width:2.5;fill:none;stroke-dasharray:8 5}
  </style>
  <rect width="960" height="620" fill="#fff"/>
  <!-- MCB -->
  <rect x="320" y="20" width="320" height="50" class="b"/><text x="480" y="50" text-anchor="middle" class="h">Placa principal MCB-C3, conector J12</text>
  <path class="l" d="M480 70 V100"/><text x="490" y="90" class="s">J1</text>
  <!-- PG-E -->
  <rect x="60" y="100" width="300" height="470" rx="6" class="b"/>
  <text x="210" y="124" text-anchor="middle" class="h">Placa MCTC-PG-E</text>
  <text x="210" y="142" text-anchor="middle" class="s">conector CN1 (15 vias)</text>
  <!-- Encoder -->
  <rect x="600" y="100" width="300" height="470" rx="6" class="b"/>
  <text x="750" y="124" text-anchor="middle" class="h">Encoder EI53C9.25-2048</text>
  <text x="750" y="142" text-anchor="middle" class="s">SIN/COS incremental, 2048 P/R, 5 V</text>
  <g class="t">
    <!-- linhas: sinal, pino PG, pino encoder -->
    <text x="80" y="176">A+ (pino 5)</text><path class="l" d="M200 172 H760"/><text x="790" y="176">A (pino 3)</text>
    <text x="80" y="206">A- (pino 6)</text><path class="l" d="M200 202 H760"/><text x="790" y="206">A- (pino 12)</text>
    <text x="80" y="236">B+ (pino 8)</text><path class="l" d="M200 232 H760"/><text x="790" y="236">B (pino 9)</text>
    <text x="80" y="266">B- (pino 1)</text><path class="l" d="M200 262 H760"/><text x="790" y="266">B- (pino 6)</text>
    <text x="80" y="296">Z+ (pino 3)</text><path class="l" d="M200 292 H760"/><text x="790" y="296">Z (pino 7)</text>
    <text x="80" y="326">Z- (pino 4)</text><path class="l" d="M200 322 H760"/><text x="790" y="326">Z- (pino 8)</text>
    <text x="80" y="356">C+ (pino 10)</text><path class="l" d="M200 352 H760"/><text x="790" y="356">C (pino 1)</text>
    <text x="80" y="386">C- (pino 11)</text><path class="l" d="M200 382 H760"/><text x="790" y="386">C- (pino 14)</text>
    <text x="80" y="416">D+ (pino 12)</text><path class="l" d="M200 412 H760"/><text x="790" y="416">D (pino 11)</text>
    <text x="80" y="446">D- (pino 13)</text><path class="l" d="M200 442 H760"/><text x="790" y="446">D- (pino 4)</text>
    <text x="80" y="476">VCC (pino 9)</text><path class="l" d="M200 472 H760"/><text x="790" y="476">5 V (pinos 2, 13)</text>
    <text x="80" y="506">COM (pino 7)</text><path class="l" d="M200 502 H760"/><text x="790" y="506">0 V (pinos 5, 10)</text>
  </g>
  <rect x="380" y="150" width="200" height="380" rx="40" fill="none" class="sh"/>
  <text x="480" y="548" text-anchor="middle" class="s">cabo blindado, pares trançados</text>
  <text x="480" y="602" text-anchor="middle" class="s">Malha ao PE do lado do controlador, de preferência em uma só ponta. Eletroduto separado, longe da potência.</text>
</svg>
